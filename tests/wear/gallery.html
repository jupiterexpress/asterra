<!doctype html><html><head>  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='3' y='27' font-size='32' fill='%23edc580'%3E%E2%9C%A7%3C/text%3E%3C/svg%3E"><meta charset="utf-8"><title>Wear visual verification</title><style>body{margin:0;background:#203f42;color:#ffedc5;font:18px sans-serif}header{position:absolute;top:15px;width:100%;text-align:center}canvas{display:block}footer{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-around}</style></head><body><header>Asterra · cosmetic wear verification · same makeBuilding used by reveal and city</header><footer><span>A+ · pristine</span><span>B · weathered</span><span>D · worn</span></footer><script type="module">
import * as THREE from 'three';
import {makeBuilding,villageReady} from '/src/village-buildings.js';
import {CONTRACTS} from '/src/blueprints.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.localClippingEnabled=true;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#203f42');scene.add(new THREE.HemisphereLight(0xffefcf,0x4c746b,1.1));const sun=new THREE.DirectionalLight(0xffdfad,1.25);sun.position.set(-12,22,12);scene.add(sun);
const camera=new THREE.OrthographicCamera(-9,9,6.25,-6.25,.1,100);camera.position.set(10,9,18);camera.lookAt(0,1,0);
await villageReady;const buildings=[];const query=new URLSearchParams(location.search),single=query.get('grade');if(single){document.querySelector('header').textContent='Asterra · shared reveal renderer · Grade '+single;document.querySelector('footer').innerHTML='<span>Supplied-grade visual fixture · Phase 1</span>';camera.left=-3.6;camera.right=3.6;camera.top=3;camera.bottom=-2;camera.position.set(6,4,9);camera.lookAt(0,1.5,0);camera.updateProjectionMatrix();}
for(const [i,grade] of (single?[single]:['A+','B','D']).entries()){const plan=CONTRACTS[Number(new URLSearchParams(location.search).get('plan')||0)];const b=makeBuilding(plan.cells,plan,{grade,garden:!query.has('noGarden')});await b.ready;b.reveal(Number(query.get("progress")??1));b.group.position.set(single?0:(i-1)*5,0,0);scene.add(b.group);buildings.push(b);}
renderer.render(scene,camera);window.galleryReady=true;window.report=()=>buildings.map(b=>b.group.userData);window.buildings=buildings;window.render=()=>renderer.render(scene,camera);
</script></body></html>
