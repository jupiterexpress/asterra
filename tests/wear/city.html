<!doctype html><html><head>  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='3' y='27' font-size='32' fill='%23edc580'%3E%E2%9C%A7%3C/text%3E%3C/svg%3E"><meta charset="utf-8"><title>City wear verification</title><style>body{margin:0;background:linear-gradient(#173e47,#688d80,#d3b389);color:#ffedc5;font:18px sans-serif}header{position:absolute;top:15px;left:20px}canvas{display:block}</style></head><body><header>Asterra · saved-grade environment wear · A+ / C / D</header><canvas id="city"></canvas><script type="module">
import {createWorld} from '/city/world.js';import {CONTRACTS} from '/src/blueprints.js';
const tiles={};for(const [i,grade] of ['A+','C','D'].entries()){const q=(i-1)*3;tiles[`${q},0`]={q,r:0,kind:'building',grade,contract:i,cells:CONTRACTS[i].cells,garden:true,born:0};tiles[`${q},1`]={q,r:1,kind:'path',lantern:true,born:0};tiles[`${q+1},0`]={q:q+1,r:0,kind:'grove',born:0};}
const world=await createWorld(document.querySelector('canvas'));world.rebuild({tiles,elapsed:0});world.tick(0);window.galleryReady=true;window.report=()=>world.wearSummary();window.world=world;
</script></body></html>
